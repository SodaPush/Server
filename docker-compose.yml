services:
  sodapush:
    build: .
    ports:
      - "8787:8787"
    environment:
      SODAPUSH_DB_URL: file:/app/data/sodapush.db
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set BOOTSTRAP_TOKEN}
    volumes:
      - sodapush-data:/app/data

volumes:
  sodapush-data:
